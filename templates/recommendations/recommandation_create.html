<!-- recommendations/templates/recommendations/recommandation_create.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Créer Recommandation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>{% if is_edit %}Modifier{% else %}Créer{% endif %} Recommandation</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">
                    {% if is_edit %}Modifier{% else %}Créer{% endif %}
                </button>
                <a href="{% url 'recommendations:list' %}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
